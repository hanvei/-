name: PAD environment proof of concept

on:
  push:
    branches: [pad-poc]
    paths:
      - 'pad-poc-engine/**'
      - '.github/workflows/pad-poc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;29.0.13846066'
      - name: Build PAD environment
        working-directory: pad-poc-engine
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pad-environment-poc-apk
          path: pad-poc-engine/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
