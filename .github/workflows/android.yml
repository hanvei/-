name: Android demo
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'platforms;android-31' 'platforms;android-27' 'build-tools;35.0.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: island
        run: bash gradlew :assembly:assembleCompleteDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-space-demo-debug
          path: island/assembly/build/outputs/apk/complete/debug/*.apk
          if-no-files-found: error


